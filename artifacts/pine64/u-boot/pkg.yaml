# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
name: u-boot-pine64
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: arm-trusted-firmware-sun50i_a64
steps:
  - sources:
      - url: https://github.com/u-boot/u-boot/archive/refs/tags/v{{ .uboot_version }}.tar.gz
        destination: u-boot.tar.gz
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      # pine64_plus_defconfig
      - |
        tar xf u-boot.tar.gz --strip-components=1
      - |
        make pine64_plus_defconfig
        # Host tools: image signing needs the OpenSSL ENGINE API (removed in the toolchain's OpenSSL),
        # and mkeficapsule needs gnutls with PKCS#11 support; neither is used for the eGON SPL image.
        ./scripts/config --disable TOOLS_LIBCRYPTO --disable TOOLS_KWBIMAGE --disable TOOLS_MKEFICAPSULE
        make olddefconfig
    build:
      - |
        export SCP=/dev/null

        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" BL31=/libs/arm-trusted-firmware/sun50i_a64/bl31.bin
    install:
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/pine64
        cp u-boot-sunxi-with-spl.bin /rootfs/artifacts/arm64/u-boot/pine64
finalize:
  - from: /rootfs
    to: /rootfs
